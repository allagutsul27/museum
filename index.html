<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Forum&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon">
  <link rel="stylesheet" href="./style/style.css">
  <title>Museum</title>
</head>
<body>
  <header class="header">
    <div class="wrapper">

      <div class="header__content">

        <div class="header__title">
          <div class="header__logo">
            <img src="./images/logo.svg" alt="museum-logo">
          </div>
          <div class="header__text">Louvre</div>
        </div>
        
        <nav class="header__nav">
          <ul class="nav__list">
            <li class="nav__item">Visiting</li>
            <li class="nav__item">Explore</li>
            <li class="nav__item">Video</li>
            <li class="nav__item">Gallery</li>
            <li class="nav__item">Tickets</li>
            <li class="nav__item">Contacts</li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

</html>
